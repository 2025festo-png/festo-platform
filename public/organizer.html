<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FestO - Paneli i Organizatorit</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --festo-gold: #D4A84C; --festo-gold-light: #E8C97A; --festo-gold-dark: #B8943E;
            --festo-gold-bg: #FDF8F0; --festo-white: #FFFFFF; --festo-black: #1A1A1A;
            --festo-dark: #2D2D2D; --festo-gray: #888888; --festo-light-gray: #F5F5F5;
            --festo-shadow: 0 20px 60px rgba(212,168,76,0.2);
            --festo-gradient: linear-gradient(135deg, #D4A84C, #B8943E);
            --festo-gradient-light: linear-gradient(135deg, #FDF8F0, #F5EDD6);
        }
        body { font-family: 'Inter', sans-serif; background: var(--festo-gradient-light); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 680px; width: 100%; margin: 20px auto; background: var(--festo-white); border-radius: 28px; padding: 35px 30px; box-shadow: var(--festo-shadow); border: 1px solid rgba(212,168,76,0.15); }
        .festo-header { text-align: center; padding-bottom: 16px; border-bottom: 1px solid rgba(212,168,76,0.1); margin-bottom: 20px; }
        .festo-header .logo { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; color: var(--festo-black); }
        .festo-header .logo span { color: var(--festo-gold); font-style: italic; }
        .festo-header .tagline { font-family: 'Playfair Display', serif; font-size: 0.85rem; color: var(--festo-gray); letter-spacing: 1.5px; margin-top: 4px; }
        .event-title-block { text-align: center; margin-bottom: 22px; }
        .event-title-block .panel-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--festo-gold-dark); font-weight: 600; }
        .event-title-block h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--festo-black); margin-top: 4px; }
        .status-box { text-align: center; padding: 40px 20px; color: var(--festo-gray); }
        .status-box.error { color: #dc3545; }
        .gallery-stats { text-align: center; color: var(--festo-gray); font-size: 0.85rem; margin-bottom: 22px; padding: 14px; background: var(--festo-gold-bg); border-radius: 10px; }
        .media-category { margin-bottom: 30px; }
        .media-category-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 600; color: var(--festo-black); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid rgba(212,168,76,0.2); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 18px; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; background: var(--festo-light-gray); aspect-ratio: 1 / 1; border: 1px solid rgba(0,0,0,0.06); cursor: pointer; transition: all 0.2s ease; }
        .gallery-item:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(212,168,76,0.2); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .gallery-item video { width: 100%; height: 100%; object-fit: cover; display: block; background: #1a1a1a; }
        .gallery-item video::-webkit-media-controls { display: flex !important; }
        .gallery-item .gallery-item-type { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.6rem; padding: 2px 7px; border-radius: 20px; }
        .gallery-item .gallery-item-name { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(0deg, rgba(0,0,0,0.65), transparent); color: #fff; font-size: 0.65rem; padding: 14px 8px 6px; }
        .gallery-item .gallery-item-delete { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(220,53,69,0.9); color: #fff; cursor: pointer; font-size: 0.8rem; line-height: 1; display: flex; align-items: center; justify-content: center; z-index: 10; }
        .gallery-item .gallery-item-delete:hover { background: #c82333; }
        /* Play button: small, bottom-right corner, doesn't dominate the thumbnail */
        .gallery-item-play {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #fff;
            pointer-events: none;
        }
        .memory-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; background: linear-gradient(135deg, #FDF8F0 0%, rgba(232,201,122,0.15) 100%); border-radius: 12px; padding: 16px 16px; margin-bottom: 10px; border-left: 4px solid var(--festo-gold); box-shadow: 0 2px 6px rgba(212,168,76,0.08); }
        .memory-card .memory-card-body strong { color: var(--festo-black); font-size: 0.9rem; font-weight: 600; display: block; }
        .memory-card .memory-card-body p { color: var(--festo-dark); font-size: 0.88rem; margin-top: 6px; line-height: 1.5; font-style: italic; }
        .memory-card .btn-icon-delete { flex-shrink: 0; background: none; border: none; cursor: pointer; color: #aaa; font-size: 1.1rem; padding: 2px 4px; margin-top: 2px; }
        .memory-card .btn-icon-delete:hover { color: #dc3545; }
        .empty-state { color: #999; text-align: center; padding: 20px; font-size: 0.85rem; font-style: italic; background: var(--festo-gold-bg); border-radius: 12px; border: 2px dashed rgba(212,168,76,0.2); }
        .refresh-row { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(212,168,76,0.1); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn-refresh, .btn-download-pdf { padding: 10px 20px; background: var(--festo-gradient); color: var(--festo-white); border: none; border-radius: 50px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; }
        .btn-refresh:hover, .btn-download-pdf:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,168,76,0.3); }
        .btn-refresh:active, .btn-download-pdf:active { transform: translateY(0); }

        /* ============================================================
           MODAL LIGHTBOX - FULLY RESPONSIVE
           ============================================================ */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 9999; padding: 0; animation: fadeIn 0.3s ease; }
        .modal-overlay.active { display: flex; align-items: center; justify-content: center; }
        .modal-container { position: relative; width: 95vw; height: 95vh; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
        .modal-content { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .modal-media { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .modal-media img { max-width: 100%; max-height: 100%; object-fit: contain; width: auto; height: auto; }
        .modal-media video { width: 100%; height: 100%; object-fit: contain; }
        .modal-close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid white; color: white; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 10000; }
        .modal-close:hover { background: rgba(255,255,255,0.4); }
        .modal-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); border: 2px solid white; color: white; padding: 12px 16px; font-size: 24px; cursor: pointer; transition: transform 0.12s ease, background 0.2s; border-radius: 8px; z-index: 9950; }
        .modal-nav-btn:hover { background: rgba(255,255,255,0.4); }
        .modal-nav-btn.nav-pulse { transform: translateY(-50%) scale(0.85); background: rgba(255,255,255,0.55); }
        .modal-prev { left: 10px; }
        .modal-next { right: 10px; }
        .modal-info { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 12px 16px; border-radius: 8px; font-size: 0.85rem; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* RESPONSIVE ADJUSTMENTS */
        @media (max-width: 768px) {
            .modal-nav-btn { padding: 10px 12px; font-size: 20px; }
            .modal-prev { left: 6px; }
            .modal-next { right: 6px; }
            .modal-close { width: 40px; height: 40px; font-size: 24px; top: 6px; right: 6px; }
            .modal-info { font-size: 0.78rem; padding: 10px 12px; }
        }

        @media (max-width: 480px) {
            body { padding: 0; }
            .container { border-radius: 0; min-height: 100vh; margin: 0; padding: 20px 16px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
            .modal-nav-btn { padding: 8px 10px; font-size: 18px; }
            .modal-prev { left: 4px; }
            .modal-next { right: 4px; }
            .modal-close { width: 36px; height: 36px; font-size: 20px; top: 4px; right: 4px; }
            .modal-info { font-size: 0.7rem; padding: 8px 10px; }
            .refresh-row { gap: 6px; }
            .btn-refresh, .btn-download-pdf { padding: 8px 16px; font-size: 0.75rem; }
        }

        @media (max-width: 320px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 6px; }
            .modal-nav-btn { padding: 6px 8px; font-size: 16px; }
            .modal-close { width: 32px; height: 32px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="festo-header">
            <div class="logo">Fest<span>O</span></div>
            <div class="tagline">✦ Paneli i Organizatorit ✦</div>
        </div>

        <div id="statusArea"></div>
        <div id="panelArea" style="display:none;">
            <div class="event-title-block">
                <div class="panel-label">Galeria e Eventit</div>
                <h1 id="eventTitle">— & —</h1>
            </div>
            <div class="gallery-stats" id="galleryStats"></div>

            <!-- KATEGORIA 1: FOTO -->
            <div class="media-category" id="photosCategory" style="display:none;">
                <div class="media-category-title">📸 FOTO</div>
                <div id="photosGrid"></div>
            </div>

            <!-- KATEGORIA 2: VIDEO -->
            <div class="media-category" id="videosCategory" style="display:none;">
                <div class="media-category-title">🎥 VIDEO</div>
                <div id="videosGrid"></div>
            </div>

            <!-- KATEGORIA 3: MESAZHET E URIMIT -->
            <div class="media-category" id="messagesCategory" style="display:none;">
                <div class="media-category-title">💬 MESAZHET E URIMIT</div>
                <button class="btn-download-pdf" id="downloadPdfBtn">📥 Shkarko PDF</button>
                <div id="messagesList" style="margin-top:16px;"></div>
            </div>

            <div class="refresh-row">
                <button class="btn-refresh" id="refreshBtn">🔄 Rifresko</button>
            </div>
        </div>
    </div>

    <!-- MODAL LIGHTBOX -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer">
            <div class="modal-content">
                <button class="modal-close" id="modalClose">✕</button>
                <button class="modal-nav-btn modal-prev" id="modalPrev">❮</button>
                <button class="modal-nav-btn modal-next" id="modalNext">❯</button>
                <div class="modal-media" id="modalMedia"></div>
                <div class="modal-info" id="modalInfo"></div>
            </div>
        </div>
    </div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const eventId = pathSegments[pathSegments.length - 1] || '';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || '';

        const statusArea = document.getElementById('statusArea');
        const panelArea = document.getElementById('panelArea');

        // Separate arrays per category so numbering ("Foto 2/3", "Video 1/3") never mixes.
        let photosArr = [];
        let videosArr = [];
        let allMemories = [];

        // Which category is currently open in the modal, and the index within that category's array.
        let currentGalleryType = 'photo'; // 'photo' | 'video'
        let currentGalleryIndex = 0;

        let eventFirstName = '', eventSecondName = '';

        function showStatus(html, isError) {
            panelArea.style.display = 'none';
            statusArea.innerHTML = `<div class="status-box${isError ? ' error' : ''}">${html}</div>`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        async function init() {
            if (!eventId || !token) {
                showStatus('❌ Ky link nuk është i plotë. Kontaktoni FestO për një link të ri.', true);
                return;
            }
            showStatus('🔍 Duke verifikuar linkun...');
            try {
                const res = await fetch(`/api/organizer/events/${eventId}/verify?token=${encodeURIComponent(token)}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    showStatus(`❌ ${escapeHtml(err.error || 'Linku nuk është i vlefshëm.')}`, true);
                    return;
                }
                const data = await res.json();
                eventFirstName = data.firstName || '?';
                eventSecondName = data.secondName || '?';
                document.getElementById('eventTitle').textContent = `${eventFirstName} & ${eventSecondName}`;
                statusArea.innerHTML = '';
                panelArea.style.display = 'block';
                loadGallery();
            } catch (err) {
                console.error('❌ Gabim në verifikim:', err);
                showStatus('❌ Gabim në lidhje me serverin.', true);
            }
        }

        async function loadGallery() {
            const photosGrid = document.getElementById('photosGrid');
            const videosGrid = document.getElementById('videosGrid');
            const messagesList = document.getElementById('messagesList');
            const photosCategory = document.getElementById('photosCategory');
            const videosCategory = document.getElementById('videosCategory');
            const messagesCategory = document.getElementById('messagesCategory');

            photosGrid.innerHTML = '<div class="empty-state">Duke ngarkuar...</div>';

            try {
                const res = await fetch(`/api/organizer/events/${eventId}/gallery?token=${encodeURIComponent(token)}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    photosGrid.innerHTML = `<div class="empty-state">❌ ${escapeHtml(err.error || 'Gabim në ngarkim')}</div>`;
                    return;
                }
                const { media, memories } = await res.json();

                photosArr = media.filter(m => m.type === 'photo');
                videosArr = media.filter(m => m.type === 'video');

                allMemories = memories;
                document.getElementById('galleryStats').textContent = `📸 ${photosArr.length} foto · 🎥 ${videosArr.length} video · 💬 ${memories.length} urime`;

                // FOTO
                if (photosArr.length > 0) {
                    photosCategory.style.display = 'block';
                    photosGrid.innerHTML = `<div class="gallery-grid">${photosArr.map((item, idx) => galleryItemHtml(item, idx, 'photo')).join('')}</div>`;
                } else {
                    photosCategory.style.display = 'none';
                }

                // VIDEO
                if (videosArr.length > 0) {
                    videosCategory.style.display = 'block';
                    videosGrid.innerHTML = `<div class="gallery-grid">${videosArr.map((item, idx) => galleryItemHtml(item, idx, 'video')).join('')}</div>`;
                } else {
                    videosCategory.style.display = 'none';
                }

                // MESAZHET
                if (memories.length > 0) {
                    messagesCategory.style.display = 'block';
                    messagesList.innerHTML = memories.map(memoryCardHtml).join('');
                } else {
                    messagesCategory.style.display = 'none';
                }

                wireActions();
                setupGalleryClick();
            } catch (err) {
                console.error('❌ Gabim në ngarkimin e galerisë:', err);
                photosGrid.innerHTML = '<div class="empty-state">❌ Gabim në lidhje me serverin.</div>';
            }
        }

        function galleryItemHtml(item, index, type) {
            const isVideo = type === 'video';
            const mediaTag = isVideo
                ? `<video muted preload="metadata" style="width:100%; height:100%; object-fit:cover; background:#1a1a1a;"><source src="${item.file_url}" type="video/mp4"><source src="${item.file_url}" type="video/webm"></video>`
                : `<img src="${item.file_url}" alt="${escapeHtml(item.name || '')}" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;">`;
            return `<div class="gallery-item" data-type="${type}" data-index="${index}">
                ${mediaTag}
                <span class="gallery-item-type">${isVideo ? '🎥' : '📸'}</span>
                ${isVideo ? '<span class="gallery-item-play">▶</span>' : ''}
                <button class="gallery-item-delete" data-action="delete-media" data-id="${item.id}" title="Fshi">✕</button>
                <span class="gallery-item-name">${escapeHtml(item.name || 'Anonim')}</span>
            </div>`;
        }

        function memoryCardHtml(memory) {
            return `<div class="memory-card">
                <div class="memory-card-body">
                    <strong>💝 ${escapeHtml(memory.name || 'Anonim')}</strong>
                    <p>"${escapeHtml(memory.text || '')}"</p>
                </div>
                <button class="btn-icon-delete" data-action="delete-memory" data-id="${memory.id}" title="Fshi">🗑️</button>
            </div>`;
        }

        function setupGalleryClick() {
            document.querySelectorAll('.gallery-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.classList.contains('gallery-item-delete')) return;
                    const index = parseInt(this.dataset.index, 10);
                    const type = this.dataset.type;
                    openModal(type, index);
                });
            });
        }

        function wireActions() {
            document.querySelectorAll('[data-action="delete-media"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteMedia(btn.dataset.id);
                });
            });
            document.querySelectorAll('[data-action="delete-memory"]').forEach(btn => {
                btn.addEventListener('click', () => deleteMemory(btn.dataset.id));
            });
        }

        // ============================================================
        // MODAL LIGHTBOX
        // ============================================================
        function currentArr() {
            return currentGalleryType === 'video' ? videosArr : photosArr;
        }

        function openModal(type, index) {
            currentGalleryType = type;
            currentGalleryIndex = index;
            showModalItem(currentGalleryIndex);
            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            // stop any playing video when closing
            const modalMedia = document.getElementById('modalMedia');
            const vid = modalMedia.querySelector('video');
            if (vid) vid.pause();
        }

        function showModalItem(index) {
            const arr = currentArr();
            if (arr.length === 0) return;
            if (index < 0) index = arr.length - 1;
            if (index >= arr.length) index = 0;
            currentGalleryIndex = index;

            const item = arr[currentGalleryIndex];
            const modalMedia = document.getElementById('modalMedia');

            if (currentGalleryType === 'video') {
                modalMedia.innerHTML = `<video controls autoplay muted playsinline style="max-width:100%; max-height:100%;"><source src="${item.file_url}" type="video/mp4"><source src="${item.file_url}" type="video/webm"></video>`;
            } else {
                modalMedia.innerHTML = `<img src="${item.file_url}" alt="${escapeHtml(item.name)}" style="max-width:100%; max-height:100%; object-fit:contain;">`;
            }

            const icon = currentGalleryType === 'video' ? '🎥' : '📸';
            const label = currentGalleryType === 'video' ? 'Video' : 'Foto';
            document.getElementById('modalInfo').innerHTML = `${icon} ${escapeHtml(item.name)} · ${label} ${currentGalleryIndex + 1} / ${arr.length}`;
        }

        // Small helper: gives a visible "pulse" on the arrow that was activated,
        // whether by click or by keyboard/swipe, so navigation feels responsive.
        function pulseNav(btn) {
            if (!btn) return;
            btn.classList.add('nav-pulse');
            setTimeout(() => btn.classList.remove('nav-pulse'), 150);
        }

        const modalPrevBtn = document.getElementById('modalPrev');
        const modalNextBtn = document.getElementById('modalNext');

        function goPrev() {
            pulseNav(modalPrevBtn);
            showModalItem(currentGalleryIndex - 1);
        }
        function goNext() {
            pulseNav(modalNextBtn);
            showModalItem(currentGalleryIndex + 1);
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        modalPrevBtn.addEventListener('click', goPrev);
        modalNextBtn.addEventListener('click', goNext);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('modalOverlay').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') goPrev();
            if (e.key === 'ArrowRight') goNext();
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        // SWIPE (touch) NAVIGATION
        // ============================================================
        const modalContainer = document.getElementById('modalContainer');
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const SWIPE_THRESHOLD = 40; // px

        modalContainer.addEventListener('touchstart', function(e) {
            const t = e.changedTouches[0];
            touchStartX = t.screenX;
            touchStartY = t.screenY;
        }, { passive: true });

        modalContainer.addEventListener('touchend', function(e) {
            const t = e.changedTouches[0];
            touchEndX = t.screenX;
            touchEndY = t.screenY;
            handleSwipeGesture();
        }, { passive: true });

        function handleSwipeGesture() {
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            // Ignore mostly-vertical swipes so scrolling/dismiss gestures aren't hijacked.
            if (Math.abs(dx) < SWIPE_THRESHOLD || Math.abs(dx) < Math.abs(dy)) return;
            if (dx < 0) {
                goNext(); // swipe left -> next
            } else {
                goPrev(); // swipe right -> prev
            }
        }

        // ============================================================
        // PDF DOWNLOAD
        // ============================================================
        // jsPDF's built-in fonts (Helvetica/Times) cannot render emoji glyphs -
        // rendering them produces the mojibake seen before (e.g. "Ø=Ü•").
        // Strip emoji / non-latin symbols from any text that goes into the PDF.
        function stripEmoji(str) {
            if (!str) return '';
            return str
                .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
                .replace(/[\u{2600}-\u{27BF}]/gu, '')
                .replace(/[\u{2190}-\u{21FF}]/gu, '')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            if (allMemories.length === 0) {
                alert('⚠️ Nuk ka urime për të shkarkuar.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            let y = 20;

            // Header (emoji-free — see stripEmoji note above)
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(22);
            doc.text('URIMET PER', pageWidth / 2, y, { align: 'center' });
            y += 10;

            doc.setFontSize(14);
            doc.text(`${stripEmoji(eventFirstName)} & ${stripEmoji(eventSecondName)}`, pageWidth / 2, y, { align: 'center' });
            y += 8;

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            const dateStr = new Date().toLocaleDateString('sq-AL', { year: 'numeric', month: 'long', day: 'numeric' });
            doc.text(`${dateStr}`, pageWidth / 2, y, { align: 'center' });
            y += 12;

            doc.setDrawColor(212, 168, 76);
            doc.line(15, y, pageWidth - 15, y);
            y += 12;

            // Messages
            doc.setFont('helvetica', 'normal');
            allMemories.forEach((msg) => {
                // Check if new page needed
                if (y > pageHeight - 30) {
                    doc.addPage();
                    y = 20;
                }

                // Name
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.setTextColor(26, 26, 26);
                doc.text(stripEmoji(msg.name) || 'Anonim', 20, y);
                y += 7;

                // Message text
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.setTextColor(45, 45, 45);
                const maxWidth = pageWidth - 40;
                const wrapped = doc.splitTextToSize(`"${stripEmoji(msg.text)}"`, maxWidth);
                doc.text(wrapped, 25, y);
                y += (wrapped.length * 6) + 10;
            });

            // Footer
            doc.setFont('helvetica', 'italic');
            doc.setFontSize(9);
            doc.setTextColor(180, 148, 62);
            doc.text('~ Gjej Vendin. Ndaj Gezimin. ~', pageWidth / 2, pageHeight - 10, { align: 'center' });

            // Save
            const fileName = `Urimet_${eventFirstName}_${eventSecondName}.pdf`;
            doc.save(fileName);
        });

        async function deleteMedia(mediaId) {
            if (!confirm('⚠️ A je i sigurt që do ta fshish këtë foto/video? Ky veprim nuk kthehet mbrapsht.')) return;
            try {
                const res = await fetch(`/api/organizer/events/${eventId}/media/${mediaId}?token=${encodeURIComponent(token)}`, { method: 'DELETE' });
                if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Gabim në fshirje'); }
                loadGallery();
            } catch (err) { alert('❌ ' + err.message); }
        }

        async function deleteMemory(memoryId) {
            if (!confirm('⚠️ A je i sigurt që do ta fshish këtë urim?')) return;
            try {
                const res = await fetch(`/api/organizer/events/${eventId}/memories/${memoryId}?token=${encodeURIComponent(token)}`, { method: 'DELETE' });
                if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Gabim në fshirje'); }
                loadGallery();
            } catch (err) { alert('❌ ' + err.message); }
        }

        document.getElementById('refreshBtn').addEventListener('click', loadGallery);
        init();
    </script>
</body>
</html>
