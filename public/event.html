<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestO - Aplikacioni i Plotë Funksional</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FDF8F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 15px 40px rgba(212, 168, 76, 0.15);
            border: 1px solid rgba(212, 168, 76, 0.2);
        }

        /* HEADER */
        .festo-header {
            padding-bottom: 18px;
            border-bottom: 1px solid #F0E6D8;
            margin-bottom: 26px;
        }
        .header-content {
            display: flex;
            align-items: center;
        }
        
        /* Gjendja Normale (Krah me krah, stil floriri, font Playfair Display) */
        .left-brand {
            flex: 0 0 42%;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #C59B27;
            line-height: 1.2;
        }
        .left-brand .event-sub {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #C59B27;
            font-style: italic;
            margin-top: 4px;
        }

        /* Gjendja Alternative për Emra të Gjatë (Të njëjtit font, në rreshta poshtë njëri-tjetrit) */
        .left-brand.long-names {
            font-size: 1rem;
            line-height: 1.2;
        }
        .left-brand.long-names .name-part {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #C59B27;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .left-brand.long-names .ampersand {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #C59B27;
            font-size: 0.85rem;
            margin: 1px 0;
        }
        .left-brand.long-names .event-sub {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: #C59B27;
            font-style: italic;
            margin-top: 2px;
        }

        .header-divider {
            width: 1px;
            height: 48px;
            background: #C59B27;
            opacity: 0.35;
            margin: 0 auto;
        }
        .right-brand {
            flex: 0 0 calc(58% - 1px);
            text-align: center;
        }
        .right-brand .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1A1A1A;
            line-height: 1;
        }
        .right-brand .logo-text span {
            color: #C59B27;
        }
        .right-brand .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 0.62rem;
            color: #555555;
            margin-top: 3px;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .right-brand .tagline span {
            color: #C59B27;
            font-weight: 600;
        }
        
        /* Yjet me animacion */
        .stars-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            user-select: none;
        }
        .stars-divider .star {
            color: #C59B27;
            display: inline-block;
            opacity: 0.6;
            font-weight: 300;
            line-height: 1;
            animation: floatStar 2.5s ease-in-out infinite;
        }
        .d1 { font-size: 0.5rem; animation-delay: 0s; }
        .d2 { font-size: 0.8rem; animation-delay: 0.4s; }
        .d3 { font-size: 1.1rem; animation-delay: 0.8s; }
        .d4 { font-size: 0.8rem; animation-delay: 1.2s; }
        .d5 { font-size: 0.5rem; animation-delay: 1.6s; }

        @keyframes floatStar {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-5px) scale(1.2); opacity: 0.9; }
        }

        /* PAMJET (VIEWS) */
        .view { display: none; }
        .view.active { display: block; }

        /* PJESA E KËRKIMIT */
        .search-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #1A1A1A;
            margin-bottom: 6px;
        }
        .main-sub {
            font-size: 0.75rem;
            color: #888888;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .form-group {
            position: relative;
            margin-bottom: 16px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #EAE2D6;
            border-radius: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
            background: #FFF;
            color: #333;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #C59B27;
            box-shadow: 0 0 0 4px rgba(197, 155, 39, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #C59B27;
            color: #FFFFFF;
            border: none;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #A67E1B;
        }

        /* REZULTATI I KËRKIMIT */
        .result-box {
            background: #FDF8F0;
            border: 1px solid #EAE2D6;
            border-radius: 14px;
            padding: 16px;
            margin-top: 16px;
            text-align: left;
            display: none;
        }
        .result-box h4 {
            font-family: 'Playfair Display', serif;
            color: #C59B27;
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .result-box p {
            font-size: 0.82rem;
            color: #444;
            line-height: 1.4;
        }

        /* BUTONAT SEKUNDARE (Në fund) */
        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid #F0E6D8;
            padding-top: 20px;
        }
        .btn-secondary {
            padding: 12px 10px;
            background: #FFFFFF;
            color: #C59B27;
            border: 2px solid #EAE2D6;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            border-color: #C59B27;
            background: #FDF8F0;
        }
        .btn-secondary svg {
            stroke: #C59B27;
        }

        /* STILIMI PËR HARTËN DHE URIMET */
        .content-view-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #1A1A1A;
            margin-bottom: 12px;
            text-align: center;
        }
        .map-box {
            background: #FAF6EF;
            border: 2px dashed #D4A84C;
            border-radius: 14px;
            padding: 30px 15px;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: #C59B27;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="festo-header">
            <div class="header-content">
                <!-- Pjesa e emrave (Me Event's poshtë, dhe ndryshim automatik nëse emrat janë të gjatë) -->
                <div class="left-brand" id="brandNamesContainer">
                    <span id="brandNamesText">X &amp; Y</span>
                    <span class="event-sub">Event's</span>
                </div>
                <div class="header-divider"></div>
                <div class="right-brand">
                    <div class="logo-text">Fest<span>O</span></div>
                    <div class="tagline">✦ <span>Find Your Place.</span> Share Your Joy. ✦</div>
                    <div class="stars-divider">
                        <span class="star d1">★</span>
                        <span class="star d2">★</span>
                        <span class="star d3">★</span>
                        <span class="star d4">★</span>
                        <span class="star d5">★</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAMJA 1: KËRKIMI I TAVOLINËS -->
        <div id="searchView" class="view active">
            <div class="search-section">
                <div class="main-title">Shkruaj emrin për të gjetur tavolinën tënde</div>
                <div class="main-sub">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    Gjej vendin tënd në sekonda
                </div>
                
                <div class="form-group">
                    <input type="text" id="guestName" placeholder="Emër Mbiemër (p.sh. Arben Hoxha)">
                </div>

                <button class="btn-primary" onclick="searchTable()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    Gjej Tavolinën
                </button>

                <div id="searchResult" class="result-box">
                    <h4 id="resTitle"></h4>
                    <p id="resDesc"></p>
                </div>
            </div>
        </div>

        <!-- PAMJA 2: HARTA E SALLËS -->
        <div id="mapView" class="view">
            <button class="back-btn" onclick="switchView('searchView')">← Kthehu te Kërkimi</button>
            <div class="content-view-title">Harta e Sallës së Dasmës</div>
            <div class="map-box">
                🗺️ [ Këtu shfaqet skema grafike e sallës, tavolinat VIP, tavolinat e miqve dhe pozicioni juaj ]
            </div>
            <button class="btn-primary" onclick="switchView('searchView')">Kthehu te Kërkimi</button>
        </div>

        <!-- PAMJA 3: NDAJ GËZIMIN -->
        <div id="joyView" class="view">
            <button class="back-btn" onclick="switchView('searchView')">← Kthehu te Kërkimi</button>
            <div class="content-view-title">Ndaj Gëzimin me Çiftin</div>
            <div class="form-group">
                <textarea id="wishText" rows="3" placeholder="Shkruani urimin tuaj për çiftin..."></textarea>
            </div>
            <button class="btn-primary" onclick="sendWish()">Dërgo Urimin</button>
            <div id="wishResult" class="result-box"></div>
        </div>

        <!-- BUTONAT SEKUNDARE (Të pranishme në çdo faqe) -->
        <div class="secondary-actions">
            <button class="btn-secondary" onclick="switchView('mapView')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
                Shiko Hartën e Sallës
            </button>
            <button class="btn-secondary" onclick="switchView('joyView')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                Ndaj Gëzimin (Urime)
            </button>
        </div>
    </div>

    <script>
        // Funksion automatik për të kontrolluar nëse emrat janë shumë të gjatë
        function checkAndFormatNames() {
            const container = document.getElementById('brandNamesContainer');
            
            // Këtu vendos emrat e çiftit (ndryshoji sipas dëshirës)
            const coupleNames = "X & Y"; 

            if (coupleNames.length > 10) {
                container.classList.add('long-names');
                const parts = coupleNames.split('&');
                if(parts.length === 2) {
                    container.innerHTML = `
                        <span class="name-part">${parts[0].trim()}</span>
                        <span class="ampersand">&amp;</span>
                        <span class="name-part">${parts[1].trim()}</span>
                        <span class="event-sub">Event's</span>
                    `;
                }
            } else {
                container.classList.remove('long-names');
                container.innerHTML = `
                    <span id="brandNamesText">${coupleNames}</span>
                    <span class="event-sub">Event's</span>
                `;
            }
        }

        // Ekzekutohet sapo të ngarkohet faqja
        window.onload = checkAndFormatNames;

        // Funksioni për të kaluar mes faqeve/pamjeve
        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // Simulim funksional i kërkimit të tavolinës
        function searchTable() {
            const name = document.getElementById('guestName').value.trim();
            const resBox = document.getElementById('searchResult');
            const resTitle = document.getElementById('resTitle');
            const resDesc = document.getElementById('resDesc');

            if(name === "") {
                alert("Ju lutem shkruani emrin tuaj!");
                return;
            }

            resBox.style.display = "block";
            resTitle.innerText = "Tavolina juaj: Tavolina Nr. 4 (VIP)";
            resDesc.innerText = "I/E ftuar: " + name + "\nPersonat e tjerë në tavolinë: Ana, Genci, Miri dhe Bora.";
        }

        // Simulim i dërgimit të urimit
        function sendWish() {
            const text = document.getElementById('wishText').value.trim();
            const wishRes = document.getElementById('wishResult');
            if(text === "") {
                alert("Ju lutem shkruani një urim para se ta dërgoni!");
                return;
            }
            wishRes.style.display = "block";
            wishRes.innerHTML = "<h4>Urimi u dërgua me sukses! 🥂</h4><p>Faleminderit që ndanë gëzimin me çiftin!</p>";
            document.getElementById('wishText').value = "";
        }
    </script>
</body>
</html>
