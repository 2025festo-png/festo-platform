<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FestO - Gjej Tavolinën Tënde</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 5px; font-size: 26px; }
        p.subtitle { color: #7f8c8d; margin-bottom: 20px; font-size: 15px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #3498db; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .result-card { margin-top: 20px; padding: 20px; border-radius: 8px; background-color: #e8f8f5; border: 1px solid #a3e4d7; display: none; }
        .error-card { margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #fadbd8; border: 1px solid #f5b7b1; color: #78281f; display: none; }
        .guest-list { list-style: none; margin-top: 10px; text-align: left; }
        .guest-list li { padding: 8px; border-bottom: 1px solid #e0e0e0; }
        .loading { display: none; margin: 15px 0; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="eventTitle">FestO</h1>
    <p class="subtitle" id="eventInfo">Po ngarkohen të dhënat...</p>

    <div class="search-box">
        <input type="text" id="guestNameInput" placeholder="Shkruaj emrin tënd (p.sh. Arben)" onkeypress="if(event.key==='Enter') searchGuest()" />
        <button onclick="searchGuest()">Kërko</button>
    </div>

    <div id="loading" class="loading">⏳ Po kërkohet...</div>
    <div id="errorCard" class="error-card"></div>

    <div id="resultCard" class="result-card">
        <h3>Tavolina Juaj: <span id="tableNumber" style="color: #27ae60; font-size: 24px;">-</span></h3>
        <p style="margin-top: 15px; font-weight: bold; color: #34495e;">Të ftuarit e tjerë në këtë tavolinë:</p>
        <ul id="tableGuestsList" class="guest-list"></ul>
    </div>
</div>

<script>
    function getEventId() {
        const segments = window.location.pathname.split('/').filter(Boolean);
        return segments[segments.length - 1];
    }

    const eventId = getEventId();

    async function loadEventDetails() {
        if (!eventId) {
            showError("ID e eventit nuk u gjet.");
            return;
        }

        try {
            const response = await fetch(`/api/events/${eventId}`);
            if (!response.ok) throw new Error("Eventi nuk u gjet.");

            const data = await response.json();
            
            // Vendos emrin e eventit (p.sh. Altin & Vana)
            document.getElementById('eventTitle').innerText = data.eventName || 'FestO';
            
            let infoText = '';
            if (data.venue) infoText += data.venue;
            if (data.date) {
                const formattedDate = new Date(data.date).toLocaleDateString('sq-AL');
                infoText += (infoText ? ' - ' : '') + formattedDate;
            }
            
            document.getElementById('eventInfo').innerText = infoText || 'Mirëseerdhët!';
        } catch (err) {
            console.error(err);
            document.getElementById('eventInfo').innerText = "⚠️ Nuk u ngarkuan dot të dhënat e eventit.";
        }
    }

    async function searchGuest() {
        const nameInput = document.getElementById('guestNameInput').value.trim();
        const resultCard = document.getElementById('resultCard');
        const errorCard = document.getElementById('errorCard');
        const loading = document.getElementById('loading');

        resultCard.style.display = 'none';
        errorCard.style.display = 'none';

        if (!nameInput) {
            showError("Ju lutem shkruani emrin tuaj.");
            return;
        }

        loading.style.display = 'block';

        try {
            const response = await fetch(`/api/events/${eventId}/guest/${encodeURIComponent(nameInput)}`);
            const data = await response.json();

            loading.style.display = 'none';

            if (!response.ok) {
                showError(data.error || "Emri nuk u gjet në listën e të ftuarve.");
                return;
            }

            document.getElementById('tableNumber').innerText = data.tableNumber || '-';
            
            const listElement = document.getElementById('tableGuestsList');
            listElement.innerHTML = '';
            
            if (data.tableGuests && Array.isArray(data.tableGuests)) {
                data.tableGuests.forEach(g => {
                    const li = document.createElement('li');
                    li.innerText = g.name;
                    if (g.name.toLowerCase() === nameInput.toLowerCase()) {
                        li.style.fontWeight = 'bold';
                        li.style.color = '#27ae60';
                        li.innerText += ' (Ju)';
                    }
                    listElement.appendChild(li);
                });
            }

            resultCard.style.display = 'block';

        } catch (err) {
            loading.style.display = 'none';
            showError("Pati një problem me kërkimin. Provoni përsëri.");
        }
    }

    function showError(msg) {
        const errorCard = document.getElementById('errorCard');
        errorCard.innerText = msg;
        errorCard.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', loadEventDetails);
</script>

</body>
</html>
